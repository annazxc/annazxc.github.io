<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Flappy Bird</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="assets/parrot.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="1200" height="800"></canvas>
      <div id="game-ui">
        <div>Score: <span id="score">0</span></div>
        <div>Best Score: <span id="highScore">0</span></div>
        <div class="life-hearts" id="life-display"></div>
      </div>
      <div class="power-meter-container">
        <h3 class="power-meter-label">Power</h3>
        <div class="power-meter">
          <div class="power-fill" id="power-fill"></div>
        </div>
      </div>

      <div id="difficulty-selector">
        <button id="easy-btn" class="diff-btn">Easy (7 lives)</button>
        <button id="medium-btn" class="diff-btn">Medium (5 lives)</button>
        <button id="hard-btn" class="diff-btn">Hard (3 lives)</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
